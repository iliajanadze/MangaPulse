name: Daily Manga Auto-Sync

on:
  schedule:
    # ეშვება ავტომატურად ყოველ 6 საათში (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  push:
    branches: [ main ] # პუშის გაკეთებისთანავე მომენტალურად იწყებს სინქრონიზაციას
  workflow_dispatch: # გაძლევთ საშუალებას ნებისმიერ დროს ხელით გაუშვათ GitHub Actions-იდან

jobs:
  sync-manga-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Execute Manga Sync Pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/auto-manga-sync.js
